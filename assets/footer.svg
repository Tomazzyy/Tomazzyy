<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Status do sistema: online. Pronto para criar o futuro.">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f7ff"/><stop offset=".5" stop-color="#7f5cff"/><stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; text-anchor: middle; }
    .a { font-size: 13px; letter-spacing: 5px; fill: #00ff9d; }
    .b { font-size: 25px; font-weight: 700; letter-spacing: 3px; }
    .wave { animation: wave 8s linear infinite; }
    .wave2 { animation-duration: 5s; animation-direction: reverse; }
    @keyframes wave { to { transform: translateX(-500px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <clipPath id="c"><rect width="1000" height="120" rx="14"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="1000" height="120" fill="#0a0e1f"/>
    <path class="wave" d="M0 104q125 -22 250 0t250 0t250 0t250 0t250 0t250 0V120H0Z" fill="#7f5cff" opacity=".28"/>
    <path class="wave wave2" d="M0 110q125 16 250 0t250 0t250 0t250 0t250 0t250 0V120H0Z" fill="#00f7ff" opacity=".28"/>
    <text class="a" x="500" y="38">● STATUS DO SISTEMA: ONLINE</text>
    <text class="b" x="500" y="76" fill="url(#edge)">PRONTO PARA CRIAR O FUTURO.</text>
  </g>
  <rect x=".75" y=".75" width="998.5" height="118.5" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
